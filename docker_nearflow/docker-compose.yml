services:
  langflow:
    image: ghcr.io/aluhning/nearflow:latest
    pull_policy: always
    ports:
      - "7860:7860"
    env_file: ../.env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"         
        max-file: "3" 
    volumes:
      - langflow-data:/app/langflow
    depends_on:
      - postgres
      - redis
    networks:
      - langflow-net

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file: ../.env
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    networks:
      - langflow-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    env_file: ../.env
    networks:
      - langflow-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
    depends_on:
      - langflow
    networks:
      - langflow-net

volumes:
  langflow-postgres:
  langflow-data:

networks:
  langflow-net:
