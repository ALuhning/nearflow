name: Deploy Nearflow Infrastructure

on:
  push:
    branches:
      - near-model  # Change if using a different deployment branch

jobs:
  deploy:
    name: Terraform Deploy to AWS
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write     # For OIDC to AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::985063132719:role/nearflow-deploy-role
          aws-region: ca-central-1

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          TF_VAR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TF_VAR_LANGFLOW_SUPERUSER: ${{ secrets.LANGFLOW_SUPERUSER }}
          TF_VAR_LANGFLOW_SUPERUSER_PASSWORD: ${{ secrets.LANGFLOW_SUPERUSER_PASSWORD }}
          TF_VAR_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          TF_VAR_LANGFLOW_AUTO_LOGIN: ${{ secrets.LANGFLOW_AUTO_LOGIN }}
          TF_VAR_LANGFLOW_CACHE_TYPE: ${{ secrets.LANGFLOW_CACHE_TYPE }}
          TF_VAR_LANGFLOW_CONFIG_DIR: ${{ secrets.LANGFLOW_CONFIG_DIR }}
          TF_VAR_LANGFLOW_DATABASE_URL: ${{ secrets.LANGFLOW_DATABASE_URL }}
          TF_VAR_LANGFLOW_ENV: ${{ secrets.LANGFLOW_ENV }}
          TF_VAR_LANGFLOW_HOST: ${{ secrets.LANGFLOW_HOST }}
          TF_VAR_LANGFLOW_LANGCHAIN_CACHE: ${{ secrets.LANGFLOW_LANGCHAIN_CACHE }}
          TF_VAR_LANGFLOW_LOG_LEVEL: ${{ secrets.LANGFLOW_LOG_LEVEL }}
          TF_VAR_LANGFLOW_LOG_FILE: ${{ secrets.LANGFLOW_LOG_FILE }}
          TF_VAR_LANGFLOW_OPEN_BROWSER: ${{ secrets.LANGFLOW_OPEN_BROWSER }}
          TF_VAR_LANGFLOW_PORT: ${{ secrets.LANGFLOW_PORT }}
          TF_VAR_LANGFLOW_REDIS_CACHE_EXPIRE: ${{ secrets.LANGFLOW_REDIS_CACHE_EXPIRE }}
          TF_VAR_LANGFLOW_REDIS_HOST: ${{ secrets.LANGFLOW_REDIS_HOST }}
          TF_VAR_LANGFLOW_REDIS_PORT: ${{ secrets.LANGFLOW_REDIS_PORT }}
          TF_VAR_LANGFLOW_REDIS_DB: ${{ secrets.LANGFLOW_REDIS_DB }}
          TF_VAR_LANGFLOW_REMOVE_API_KEYS: ${{ secrets.LANGFLOW_REMOVE_API_KEYS }}
          TF_VAR_LANGFLOW_SAVE_DB_IN_CONFIG_DIR: ${{ secrets.LANGFLOW_SAVE_DB_IN_CONFIG_DIR }}
          TF_VAR_LANGFLOW_STORE_ENVIRONMENT_VARIABLES: ${{ secrets.LANGFLOW_STORE_ENVIRONMENT_VARIABLES }}
          TF_VAR_LANGFLOW_WORKERS: ${{ secrets.LANGFLOW_WORKERS }}
