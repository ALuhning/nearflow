name: Build, Deploy Infra, and Restart App

on:
  push:
    branches:
      - near-model
  workflow_dispatch:

jobs:
  terraform-deploy:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/nearflow-deploy-role
          aws-region: ca-central-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          TF_VAR_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TF_VAR_LANGFLOW_SUPERUSER: ${{ secrets.LANGFLOW_SUPERUSER }}
          TF_VAR_LANGFLOW_SUPERUSER_PASSWORD: ${{ secrets.LANGFLOW_SUPERUSER_PASSWORD }}
          TF_VAR_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          TF_VAR_LANGFLOW_AUTO_LOGIN: ${{ secrets.LANGFLOW_AUTO_LOGIN }}
          TF_VAR_LANGFLOW_CONFIG_DIR: ${{ secrets.LANGFLOW_CONFIG_DIR }}
          TF_VAR_LANGFLOW_DATABASE_URL: ${{ secrets.LANGFLOW_DATABASE_URL }}
          TF_VAR_LANGFLOW_PORT: ${{ secrets.LANGFLOW_PORT }}
          TF_VAR_LANGFLOW_ENV: ${{ secrets.LANGFLOW_ENV }}
          TF_VAR_LANGFLOW_CACHE_TYPE: ${{ secrets.LANGFLOW_CACHE_TYPE }}
          TF_VAR_LANGFLOW_LOG_FILE: ${{ secrets.LANGFLOW_LOG_FILE }}
          TF_VAR_LANGFLOW_LOG_LEVEL: ${{ secrets.LANGFLOW_LOG_LEVEL }}
          TF_VAR_LANGFLOW_LANGCHAIN_CACHE: ${{ secrets.LANGFLOW_LANGCHAIN_CACHE }}
          TF_VAR_LANGFLOW_OPEN_BROWSER: ${{ secrets.LANGFLOW_OPEN_BROWSER }}
          TF_VAR_LANGFLOW_REDIS_CACHE_EXPIRE: ${{ secrets.LANGFLOW_REDIS_CACHE_EXPIRE }}
          TF_VAR_LANGFLOW_REDIS_DB: ${{ secrets.LANGFLOW_REDIS_DB }}
          TF_VAR_LANGFLOW_REDIS_HOST: ${{ secrets.LANGFLOW_REDIS_HOST }}
          TF_VAR_LANGFLOW_REDIS_PORT: ${{ secrets.LANGFLOW_REDIS_PORT }}
          TF_VAR_LANGFLOW_REMOVE_API_KEYS: ${{ secrets.LANGFLOW_REMOVE_API_KEYS }}
          TF_VAR_LANGFLOW_SAVE_DB_IN_CONFIG_DIR: ${{ secrets.LANGFLOW_SAVE_DB_IN_CONFIG_DIR }}
          TF_VAR_LANGFLOW_STORE_ENVIRONMENT_VARIABLES: ${{ secrets.LANGFLOW_STORE_ENVIRONMENT_VARIABLES }}
          TF_VAR_LANGFLOW_WORKERS: ${{ secrets.LANGFLOW_WORKERS }}
          TF_VAR_LANGFLOW_HOST: ${{ secrets.LANGFLOW_HOST }}
          TF_VAR_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TF_VAR_PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          TF_VAR_PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          TF_VAR_PROD_SSH_PUB_KEY: ${{ secrets.PROD_SSH_PUB_KEY }}

  build-and-deploy:
    name: Build and Deploy Docker Image
    runs-on: ubuntu-latest
    needs: terraform-deploy
    environment: nearflow-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file with secrets
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> nearflow.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> nearflow.env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> nearflow.env
          echo "LANGFLOW_SUPERUSER=${{ secrets.LANGFLOW_SUPERUSER }}" >> nearflow.env
          echo "LANGFLOW_SUPERUSER_PASSWORD=${{ secrets.LANGFLOW_SUPERUSER_PASSWORD }}" >> nearflow.env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> nearflow.env
          echo "LANGFLOW_AUTO_LOGIN=${{ secrets.LANGFLOW_AUTO_LOGIN }}" >> nearflow.env
          echo "LANGFLOW_CONFIG_DIR=${{ secrets.LANGFLOW_CONFIG_DIR }}" >> nearflow.env
          echo "LANGFLOW_DATABASE_URL=${{ secrets.LANGFLOW_DATABASE_URL }}" >> nearflow.env
          echo "LANGFLOW_PORT=${{ secrets.LANGFLOW_PORT }}" >> nearflow.env
          echo "LANGFLOW_ENV=${{ secrets.LANGFLOW_ENV }}" >> nearflow.env
          echo "LANGFLOW_CACHE_TYPE=${{ secrets.LANGFLOW_CACHE_TYPE }}" >> nearflow.env
          echo "LANGFLOW_LOG_FILE=${{ secrets.LANGFLOW_LOG_FILE }}" >> nearflow.env
          echo "LANGFLOW_LOG_LEVEL=${{ secrets.LANGFLOW_LOG_LEVEL }}" >> nearflow.env
          echo "LANGFLOW_LANGCHAIN_CACHE=${{ secrets.LANGFLOW_LANGCHAIN_CACHE }}" >> nearflow.env
          echo "LANGFLOW_OPEN_BROWSER=${{ secrets.LANGFLOW_OPEN_BROWSER }}" >> nearflow.env
          echo "LANGFLOW_REDIS_CACHE_EXPIRE=${{ secrets.LANGFLOW_REDIS_CACHE_EXPIRE }}" >> nearflow.env
          echo "LANGFLOW_REDIS_DB=${{ secrets.LANGFLOW_REDIS_DB }}" >> nearflow.env
          echo "LANGFLOW_REDIS_HOST=${{ secrets.LANGFLOW_REDIS_HOST }}" >> nearflow.env
          echo "LANGFLOW_REDIS_PORT=${{ secrets.LANGFLOW_REDIS_PORT }}" >> nearflow.env
          echo "LANGFLOW_REMOVE_API_KEYS=${{ secrets.LANGFLOW_REMOVE_API_KEYS }}" >> nearflow.env
          echo "LANGFLOW_SAVE_DB_IN_CONFIG_DIR=${{ secrets.LANGFLOW_SAVE_DB_IN_CONFIG_DIR }}" >> nearflow.env
          echo "LANGFLOW_STORE_ENVIRONMENT_VARIABLES=${{ secrets.LANGFLOW_STORE_ENVIRONMENT_VARIABLES }}" >> nearflow.env
          echo "LANGFLOW_WORKERS=${{ secrets.LANGFLOW_WORKERS }}" >> nearflow.env
          echo "LANGFLOW_HOST=${{ secrets.LANGFLOW_HOST }}" >> nearflow.env
          echo "GHCR_PAT=${{ secrets.GHCR_PAT }}" >> nearflow.env

      - name: Print .env contents (DEBUG ONLY – remove in production)
        run: cat nearflow.env | grep POSTGRES

      - name: Rename .env for scp
        run: mv nearflow.env nearflow_env_upload.env

      - name: Upload .env to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "./nearflow_env_upload.env"
          target: "/tmp/"

      - name: Authenticate with GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ALuhning --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/aluhning/nearflow:latest .

      - name: Push Docker image
        run: docker push ghcr.io/aluhning/nearflow:latest

      - name: SSH to EC2 and update containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            echo "=== Move .env into place ==="
            sudo mv -f /tmp/nearflow_env_upload.env /opt/nearflow/.env

            cd /opt/nearflow
            git checkout near-model
            git pull origin near-model

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ALuhning --password-stdin
            echo "Running docker-compose..."
            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            echo "✅ Deployment complete"
