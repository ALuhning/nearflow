server {
    listen 80;
    server_name ai.vitalpoint.ai;

    # Gzip settings
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1000;
    gzip_types text/xml text/css;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_disable "MSIE [4-6] \.";

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}

server {
    listen 443 ssl;
    server_name ai.vitalpoint.ai;

    ssl_certificate /etc/letsencrypt/live/ai.vitalpoint.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.vitalpoint.ai/privkey.pem;

    location / {
        # Proxy settings to forward requests to Langflow
        proxy_pass http://langflow:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
